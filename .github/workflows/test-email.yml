name: Test Email

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-email:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send test email
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage

          sender = os.environ["EMAIL_USER"].strip()
          password = os.environ["EMAIL_APP_PASSWORD"].replace(" ", "").strip()
          recipients = [
              address.strip()
              for address in os.environ["EMAIL_TO"].split(",")
              if address.strip()
          ]

          if not sender or not password or not recipients:
              raise RuntimeError("請確認三個 GitHub Secrets 都已填寫。")

          message = EmailMessage()
          message["Subject"] = "P4 停車位通知：寄信測試"
          message["From"] = sender
          message["To"] = ", ".join(recipients)
          message.set_content(
              "這是一封測試信。\n\n"
              "收到這封信，表示 GitHub Actions 的寄信設定成功。\n"
              "這封信不代表 2026/10/29 已有停車位釋出。"
          )

          with smtplib.SMTP_SSL(
              "smtp.gmail.com",
              465,
              context=ssl.create_default_context(),
              timeout=30,
          ) as server:
              server.login(sender, password)
              refused = server.send_message(
                  message,
                  from_addr=sender,
                  to_addrs=recipients,
              )
              if refused:
                  raise RuntimeError("部分收件人未被郵件伺服器接受。")

          print("測試信已交給 Gmail 寄送，請查看兩個收件信箱。")
          PY
